name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest -q

      - name: Generate sample data
        run: python -m data_generator.generate_data --days 7 --rows 100

      - name: Run full pipeline (offline)
        run: python -m pipeline.run_pipeline --skip-weather